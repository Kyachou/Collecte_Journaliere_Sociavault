name: Collecte Sociavault quotidienne

on:
  schedule:
    # Tous les jours à 22h00 UTC (= 23h00 ou 00h00 en France selon l'heure d'été/hiver)
    - cron: "0 22 * * *"
  workflow_dispatch:
    # Ajoute un bouton "Run workflow" dans l'onglet Actions de GitHub,
    # pour lancer manuellement sans attendre le lendemain matin.

permissions:
  contents: write   # nécessaire pour que le job puisse recommitter data/

jobs:
  collecte:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la collecte
        timeout-minutes: 240
        continue-on-error: true   # NOUVEAU : un timeout/échec ici ne bloque plus les steps suivants
        env:
          SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
        run: python collecte.py

      - name: Lancer la collecte internationale
        timeout-minutes: 80
        continue-on-error: true   # NOUVEAU : idem
        env:
          SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
        run: python collecte_international.py

      - name: Uploader le corpus vers Google Drive
        if: always()   # NOUVEAU : on tente l'upload même si une collecte précédente a échoué/timeout
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python drive_upload.py

      - name: Sauvegarder les résultats dans le repo (corpus + pending)
        if: always()   # NOUVEAU : garantit le commit/push même si tout le reste a échoué,
                        # pour ne jamais perdre les données déjà collectées avant un incident
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Collecte automatique du $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push